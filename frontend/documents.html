<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents — Family Health Record</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-logo"><h1>Family Health Record</h1><p>Your Health OS</p></div>
    <div class="sidebar-nav">
      <a href="index.html"><span class="nav-icon">🏠</span>Dashboard</a>
      <a href="members.html"><span class="nav-icon">👥</span>Family Members</a>
      <a href="upload.html"><span class="nav-icon">📤</span>Upload</a>
      <a href="documents.html"><span class="nav-icon">📄</span>Documents</a>
      <a href="timeline.html"><span class="nav-icon">📅</span>Timeline</a>
      <a href="medicines.html"><span class="nav-icon">💊</span>Medicines</a>
      <a href="trends.html"><span class="nav-icon">📈</span>Trends</a>
      <a href="alerts.html"><span class="nav-icon">🔔</span>Alerts</a>
      <a href="summary.html"><span class="nav-icon">📋</span>Doctor Summary</a>
    </div>
    <div class="sidebar-footer"><div class="user-email"></div><a href="#" onclick="signOut()" style="color:#6B85AC;font-size:12px">Sign out</a></div>
  </nav>
  <div class="main">
    <div class="topbar">
      <h2>Documents</h2>
      <div class="topbar-actions"><a href="upload.html" class="btn btn-primary">+ Upload</a></div>
    </div>
    <div class="content">
      <div id="error-banner" class="alert-banner error" style="display:none"></div>
      <div class="filters">
        <input class="form-control" id="f-search" placeholder="Search title..." oninput="loadDocs()">
        <select class="form-control" id="f-member" onchange="loadDocs()"><option value="">All Members</option></select>
        <select class="form-control" id="f-type" onchange="loadDocs()">
          <option value="">All Types</option>
          <option value="blood_report">Blood Report</option>
          <option value="prescription">Prescription</option>
          <option value="imaging">Imaging</option>
          <option value="vaccination">Vaccination</option>
          <option value="other">Other</option>
        </select>
        <input class="form-control" type="date" id="f-from" onchange="loadDocs()" placeholder="From date">
        <input class="form-control" type="date" id="f-to" onchange="loadDocs()" placeholder="To date">
      </div>
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Title</th><th>Member</th><th>Type</th><th>Date</th><th>Facility</th><th>Status</th><th></th></tr></thead>
            <tbody id="docs-body"><tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted)">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/documents.js"></script>
</body>
</html>
