<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Members — Family Health Record</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-logo"><h1>Family Health Record</h1><p>Your Health OS</p></div>
    <div class="sidebar-nav">
      <a href="index.html"><span class="nav-icon">🏠</span>Dashboard</a>
      <a href="members.html"><span class="nav-icon">👥</span>Family Members</a>
      <a href="upload.html"><span class="nav-icon">📤</span>Upload</a>
      <a href="documents.html"><span class="nav-icon">📄</span>Documents</a>
      <a href="timeline.html"><span class="nav-icon">📅</span>Timeline</a>
      <a href="medicines.html"><span class="nav-icon">💊</span>Medicines</a>
      <a href="trends.html"><span class="nav-icon">📈</span>Trends</a>
      <a href="alerts.html"><span class="nav-icon">🔔</span>Alerts</a>
      <a href="summary.html"><span class="nav-icon">📋</span>Doctor Summary</a>
      <a href="ask.html"><span class="nav-icon">🤖</span>Ask AI</a>
      <a href="search.html"><span class="nav-icon">🔍</span>Search</a>
    </div>
    <div class="sidebar-footer"><div class="user-email"></div><a href="#" onclick="signOut()" style="color:#6B85AC;font-size:12px">Sign out</a></div>
  </nav>
  <div class="main">
    <div class="topbar">
      <h2>Family Members</h2>
      <div class="topbar-actions"><button class="btn btn-primary" onclick="openAddModal()">+ Add Member</button></div>
    </div>
    <div class="content">
      <div id="error-banner" class="alert-banner error" style="display:none"></div>
      <div class="grid-3" id="member-grid">
        <div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">👥</div><h3>No family members yet</h3><p>Add members to start tracking their health records.</p></div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Member Modal -->
<div class="modal-overlay" id="member-modal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Add Family Member</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="form-row">
        <div class="form-group"><label class="form-label">Name *</label><input class="form-control" id="f-name" placeholder="Full name"></div>
        <div class="form-group"><label class="form-label">Relationship</label>
          <select class="form-control" id="f-relation">
            <option value="">Select</option>
            <option>self</option><option>spouse</option><option>parent</option><option>child</option><option>sibling</option><option>other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Date of Birth</label><input class="form-control" type="date" id="f-dob"></div>
        <div class="form-group"><label class="form-label">Gender</label>
          <select class="form-control" id="f-gender">
            <option value="">Select</option><option>male</option><option>female</option><option>other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Blood Type</label>
          <select class="form-control" id="f-blood">
            <option value="">Unknown</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Known Allergies <span style="font-weight:400;text-transform:none">(comma-separated)</span></label><input class="form-control" id="f-allergies" placeholder="e.g. Penicillin, Sulfa drugs"></div>
      <div class="form-group"><label class="form-label">Chronic Conditions <span style="font-weight:400;text-transform:none">(comma-separated)</span></label><input class="form-control" id="f-conditions" placeholder="e.g. Type 2 Diabetes, Hypertension"></div>
      <div class="form-group"><label class="form-label">Notes</label><textarea class="form-control" id="f-notes" rows="2" placeholder="Any other notes"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveMember()">Save</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/members.js"></script>
</body>
</html>
