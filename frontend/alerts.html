<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerts — Family Health Record</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-logo"><h1>Family Health Record</h1><p>Your Health OS</p></div>
    <div class="sidebar-nav">
      <a href="index.html"><span class="nav-icon">🏠</span>Dashboard</a>
      <a href="members.html"><span class="nav-icon">👥</span>Family Members</a>
      <a href="upload.html"><span class="nav-icon">📤</span>Upload</a>
      <a href="documents.html"><span class="nav-icon">📄</span>Documents</a>
      <a href="timeline.html"><span class="nav-icon">📅</span>Timeline</a>
      <a href="medicines.html"><span class="nav-icon">💊</span>Medicines</a>
      <a href="trends.html"><span class="nav-icon">📈</span>Trends</a>
      <a href="alerts.html"><span class="nav-icon">🔔</span>Alerts</a>
      <a href="summary.html"><span class="nav-icon">📋</span>Doctor Summary</a>
    </div>
    <div class="sidebar-footer"><div class="user-email"></div><a href="#" onclick="signOut()" style="color:#6B85AC;font-size:12px">Sign out</a></div>
  </nav>
  <div class="main">
    <div class="topbar"><h2>Alerts</h2></div>
    <div class="content">
      <div id="error-banner" class="alert-banner error" style="display:none"></div>
      <div class="filters">
        <select class="form-control" id="f-member" onchange="loadAlerts()"><option value="">All Members</option></select>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">
          <input type="checkbox" id="f-dismissed" onchange="loadAlerts()"> Show dismissed
        </label>
      </div>
      <div class="card" id="alerts-card">
        <div id="alerts-list">
          <div class="empty-state" style="padding:40px"><div class="empty-icon">✅</div><h3>No active alerts</h3><p>Alerts are generated when lab values exceed thresholds or prescriptions need renewal.</p></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/alerts.js"></script>
</body>
</html>
