<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Document — Family Health Record</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-logo"><h1>Family Health Record</h1><p>Your Health OS</p></div>
    <div class="sidebar-nav">
      <a href="index.html"><span class="nav-icon">🏠</span>Dashboard</a>
      <a href="members.html"><span class="nav-icon">👥</span>Family Members</a>
      <a href="upload.html"><span class="nav-icon">📤</span>Upload</a>
      <a href="documents.html"><span class="nav-icon">📄</span>Documents</a>
      <a href="timeline.html"><span class="nav-icon">📅</span>Timeline</a>
      <a href="medicines.html"><span class="nav-icon">💊</span>Medicines</a>
      <a href="trends.html"><span class="nav-icon">📈</span>Trends</a>
      <a href="alerts.html"><span class="nav-icon">🔔</span>Alerts</a>
      <a href="summary.html"><span class="nav-icon">📋</span>Doctor Summary</a>
      <a href="ask.html"><span class="nav-icon">🤖</span>Ask AI</a>
      <a href="search.html"><span class="nav-icon">🔍</span>Search</a>
    </div>
    <div class="sidebar-footer"><div class="user-email"></div><a href="#" onclick="signOut()" style="color:#6B85AC;font-size:12px">Sign out</a></div>
  </nav>
  <div class="main">
    <div class="topbar"><h2>Upload Document</h2></div>
    <div class="content">
      <div style="max-width:620px">
        <div id="error-banner" class="alert-banner error" style="display:none"></div>
        <div id="success-banner" class="alert-banner success" style="display:none"></div>
        <div class="card">
          <div class="card-body">
            <!-- Drop zone -->
            <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
              <div class="upload-icon">📤</div>
              <p><strong>Click to choose</strong> or drag & drop</p>
              <p style="margin-top:6px">PDF, JPG, PNG — max 20 MB</p>
            </div>
            <input type="file" id="file-input" accept=".pdf,.jpg,.jpeg,.png,.webp" style="display:none">
            <div id="file-preview" style="display:none;margin-top:12px;padding:10px 14px;background:#F7F9FC;border-radius:6px;font-size:13px">
              <span id="file-name"></span>
              <button onclick="clearFile()" style="float:right;background:none;border:none;cursor:pointer;color:var(--danger)">✕</button>
            </div>

            <div style="margin-top:20px">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Family Member *</label>
                  <select class="form-control" id="f-member"><option value="">Loading...</option></select>
                </div>
                <div class="form-group">
                  <label class="form-label">Document Type *</label>
                  <select class="form-control" id="f-type">
                    <option value="">Select type</option>
                    <option value="blood_report">Blood Report</option>
                    <option value="prescription">Prescription</option>
                    <option value="imaging">Imaging / Scan</option>
                    <option value="vaccination">Vaccination Record</option>
                    <option value="other">Other</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Document Title *</label>
                <input class="form-control" id="f-title" placeholder="e.g. Thyrocare Complete Blood Count March 2025">
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Report Date</label>
                  <input class="form-control" type="date" id="f-date">
                </div>
                <div class="form-group">
                  <label class="form-label">Facility / Lab Name</label>
                  <input class="form-control" id="f-facility" placeholder="e.g. Thyrocare, Apollo">
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Doctor Name</label>
                <input class="form-control" id="f-doctor" placeholder="e.g. Dr. Ramesh Kumar">
              </div>
              <div class="form-group">
                <label class="form-label">Notes</label>
                <textarea class="form-control" id="f-notes" rows="2" placeholder="Any additional context"></textarea>
              </div>
            </div>

            <div id="progress-wrap" style="display:none;margin-top:12px">
              <p style="font-size:12px;color:var(--text-muted);margin-bottom:6px" id="progress-label">Uploading...</p>
              <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
            </div>

            <div style="margin-top:20px;display:flex;gap:10px">
              <button class="btn btn-primary" id="upload-btn" onclick="submitUpload()">Upload & Extract</button>
              <button class="btn btn-secondary" onclick="clearForm()">Clear</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/upload.js"></script>
</body>
</html>
